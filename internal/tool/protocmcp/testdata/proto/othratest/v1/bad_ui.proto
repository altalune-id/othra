syntax = "proto3";

package othratest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/othra/internal/tool/protocmcp/testdata/gen/othratest/v1;othratestv1";

service BadUIService {
  rpc BadUI(BadUIRequest) returns (BadUIResponse) {
    option (mcp.v1.tool) = {
      name: "bad_ui"
      ui: "App_1"
    };
  }
}

message BadUIRequest {}

message BadUIResponse {}
