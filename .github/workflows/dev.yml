name: dev-image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  push-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short sha and build time
        id: meta
        run: |
          echo "sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push the edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/oagent:edge
            ghcr.io/${{ github.repository_owner }}/oagent:${{ steps.meta.outputs.sha }}
          # NOTE: image.source links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.title=oagent
            org.opencontainers.image.version=edge-${{ steps.meta.outputs.sha }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.time }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            VERSION=edge-${{ steps.meta.outputs.sha }}
            COMMIT=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
