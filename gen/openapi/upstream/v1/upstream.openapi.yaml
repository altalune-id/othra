        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upstream.v1.DeleteUpstreamResponse'
  /upstream.v1.UpstreamService/GetUpstream:
    post:
      tags:
        - upstream.v1.UpstreamService
      summary: GetUpstream
      operationId: upstream.v1.UpstreamService.GetUpstream
