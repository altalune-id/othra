openapi: 3.1.0
info:
  title: auth.v1
paths:
  /auth.v1.AuthService/ChangePassword:
    post:
      tags:
        - auth.v1.AuthService
      summary: ChangePassword
      description: ChangePassword checks the current password, sets a new one and signs out every other session.
      operationId: auth.v1.AuthService.ChangePassword
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.ChangePasswordRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.ChangePasswordResponse'
  /auth.v1.AuthService/CreateOwnOrg:
    post:
      tags:
        - auth.v1.AuthService
      summary: CreateOwnOrg
      description: CreateOwnOrg creates an organization the signed-in person owns, with its default project; cloud signup's one org per person.
      operationId: auth.v1.AuthService.CreateOwnOrg
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.CreateOwnOrgRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.CreateOwnOrgResponse'
  /auth.v1.AuthService/SetActiveOrg:
    post:
      tags:
        - auth.v1.AuthService
      summary: SetActiveOrg
      description: SetActiveOrg makes an organization the signed-in person belongs to the active one of this session.
      operationId: auth.v1.AuthService.SetActiveOrg
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.SetActiveOrgRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.SetActiveOrgResponse'
  /auth.v1.AuthService/SignOutEverywhere:
    post:
      tags:
        - auth.v1.AuthService
      summary: SignOutEverywhere
      description: SignOutEverywhere ends every session of the signed-in person, this one included.
      operationId: auth.v1.AuthService.SignOutEverywhere
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.SignOutEverywhereRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.SignOutEverywhereResponse'
  /auth.v1.AuthService/UpdateProfile:
    post:
      tags:
        - auth.v1.AuthService
      summary: UpdateProfile
      description: UpdateProfile sets the signed-in person's name; an empty name falls back to the email in the console.
      operationId: auth.v1.AuthService.UpdateProfile
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.UpdateProfileRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.UpdateProfileResponse'
  /auth.v1.AuthService/Whoami:
    post:
      tags:
        - auth.v1.AuthService
      summary: Whoami
      description: Whoami describes the credential the request was made with.
      operationId: auth.v1.AuthService.Whoami
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.WhoamiRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.WhoamiResponse'
components:
  schemas:
    auth.v1.ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          title: current_password
        newPassword:
          type: string
          title: new_password
          maxLength: 256
          minLength: 12
      title: ChangePasswordRequest
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    auth.v1.ChangePasswordResponse:
      type: object
      title: ChangePasswordResponse
      additionalProperties: false
    auth.v1.CreateOwnOrgRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |
            othra.name.blank = true
            othra.name.max_len.200 = true
        slug:
          type: string
          title: slug
          description: |
            othra.slug.format = true
            othra.slug.max_len.64 = true
            othra.slug.min_len.3 = true
      title: CreateOwnOrgRequest
      required:
        - name
      additionalProperties: false
    auth.v1.CreateOwnOrgResponse:
      type: object
      properties:
        org:
          title: org
          $ref: '#/components/schemas/org.v1.Org'
      title: CreateOwnOrgResponse
      additionalProperties: false
    auth.v1.SetActiveOrgRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: |
            Public id of an organization the person belongs to; any other answers not found.
            othra.public_id = true
      title: SetActiveOrgRequest
      additionalProperties: false
    auth.v1.SetActiveOrgResponse:
      type: object
      properties:
        me:
          title: me
          description: The session after the switch, as Whoami describes it.
          $ref: '#/components/schemas/auth.v1.WhoamiResponse'
      title: SetActiveOrgResponse
      additionalProperties: false
    auth.v1.SignOutEverywhereRequest:
      type: object
      title: SignOutEverywhereRequest
      additionalProperties: false
    auth.v1.SignOutEverywhereResponse:
      type: object
      properties:
        signedOut:
          type: boolean
          title: signed_out
          description: 'Always true: this session ended too, so the client signs in again.'
      title: SignOutEverywhereResponse
      additionalProperties: false
    auth.v1.UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |
            At most 200 characters; surrounding spaces are trimmed.
            user.name.max_len.200
      title: UpdateProfileRequest
      additionalProperties: false
    auth.v1.UpdateProfileResponse:
      type: object
      properties:
        userId:
          type: string
          title: user_id
          description: The person's public id.
        name:
          type: string
          title: name
      title: UpdateProfileResponse
      additionalProperties: false
    auth.v1.WhoamiRequest:
      type: object
      title: WhoamiRequest
      additionalProperties: false
    auth.v1.WhoamiResponse:
      type: object
      properties:
        source:
          type: string
          title: source
          description: local, oidc, basic, apikey or system.
        userId:
          type: string
          title: user_id
        email:
          type: string
          title: email
        name:
          type: string
          title: name
        avatarUrl:
          type: string
          title: avatar_url
        keyHint:
          type: string
          title: key_hint
          description: 'Set for API keys: the last 4 characters of the key''s secret.'
        ownerId:
          type: string
          title: owner_id
          description: 'Personal keys: the person the key acts for.'
        activeOrgId:
          type: string
          title: active_org_id
        activeOrgSlug:
          type: string
          title: active_org_slug
        activeProjectId:
          type: string
          title: active_project_id
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: Effective permissions after roles, key scopes and grants are intersected.
        operator:
          type: boolean
          title: operator
        orgCreation:
          type: boolean
          title: org_creation
          description: Whether this deployment lets the caller create organizations (cloud only).
        fileUploads:
          type: boolean
          title: file_uploads
          description: Whether this deployment has file storage, so the caller can upload files such as a project logo.
        passwords:
          type: boolean
          title: passwords
          description: 'Whether this person can change a password: password sign-in is on here and they have one.'
      title: WhoamiResponse
      additionalProperties: false
      description: Every id is a public id.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A ProtoJSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a ProtoJSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    org.v1.Org:
      type: object
      properties:
        id:
          type: string
          title: id
        slug:
          type: string
          title: slug
        name:
          type: string
          title: name
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        role:
          type: string
          title: role
          description: role is the caller's role in this org; set only when a person lists the orgs they belong to.
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: permissions are what that role grants in this org, so a client can offer only the scopes a key there may hold.
        system:
          type: boolean
          title: system
          description: system is true for the deployment's system org, which holds the console project.
      title: Org
      additionalProperties: false
security: []
tags:
  - name: auth.v1.AuthService
