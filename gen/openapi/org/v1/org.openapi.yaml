openapi: 3.1.0
info:
  title: org.v1
paths:
  /org.v1.OrgService/CreateOrg:
    post:
      tags:
        - org.v1.OrgService
      summary: CreateOrg
      operationId: org.v1.OrgService.CreateOrg
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/org.v1.CreateOrgRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/org.v1.CreateOrgResponse'
