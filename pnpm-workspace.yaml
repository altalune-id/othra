packages:
  - ui/base # shared Nuxt layer: components, i18n, generated API clients
  - ui/console # admin console
  - ui/portal # end-user portal
  - ui/mcp # MCP app UI
  - ui/web # CSS for the Go-rendered pages
  - ui/vitest-config # shared Vitest presets
  - ui/scripts # build and lint scripts

onlyBuiltDependencies:
  - esbuild

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# Versions shared by more than one ui/* package; reference them as "catalog:".
catalog:
  "@iconify-json/lucide": ^1.2.147
  "@iconify/vue": ^5.0.4
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.6.5
  "@vitejs/plugin-vue": ^6.0.10
  "@vitest/coverage-v8": 5.0.5
  "@vue/test-utils": 2.5.1
  daisyui: ^5.7.50
  happy-dom: 21.0.4
  tailwindcss: ^4.3.3
  typescript: 6.0.3
  vite: ^8.3.5
  vitest: 5.0.5
  vue: ^3.5.44
  vue-tsc: ^3.3.13
