openapi: 3.1.0
info:
  title: upstream.v1
paths:
  /upstream.v1.UpstreamService/CreateUpstream:
    post:
      tags:
        - upstream.v1.UpstreamService
      summary: CreateUpstream
      description: 'SECURITY: create and update carry the upstream''s client secret; a signed-in person sends them, never MCP.'
      operationId: upstream.v1.UpstreamService.CreateUpstream
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upstream.v1.CreateUpstreamRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upstream.v1.CreateUpstreamResponse'
  /upstream.v1.UpstreamService/DeleteUpstream:
    post:
      tags:
        - upstream.v1.UpstreamService
      summary: DeleteUpstream
      operationId: upstream.v1.UpstreamService.DeleteUpstream
