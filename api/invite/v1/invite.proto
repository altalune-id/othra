syntax = "proto3";

package invite.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/annotations.proto";
import "othra/v1/rules.proto";

option go_package = "altalune.id/othra/gen/go/invite/v1;invitev1";

// InviteService invites people into an organization by email. Every id is a public id.
service InviteService {
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc ResendInvite(ResendInviteRequest) returns (ResendInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc DraftInvite(DraftInviteRequest) returns (DraftInviteResponse) {
    option (mcp.v1.tool) = {
      name: "member_invite"
      title: "Invite a member"
      description: "Suggest inviting a person to an organization as a member. This only drafts the invite: a person must confirm it in the view before any email is sent."
      required: ["org_id", "email"]
      mutation: true
      destructive: false
      ui: "app"
    };
  }
  rpc ConfirmDraftInvite(ConfirmDraftInviteRequest) returns (ConfirmDraftInviteResponse) {
    option (mcp.v1.tool) = {
      name: "member_invite_confirm"
      title: "Confirm an invite"
      description: "Send a drafted invite. Only the person in the view can call this."
      required: ["org_id", "invite_id"]
      mutation: true
      destructive: false
      ui: "app"
      app_only: true
    };
  }
  rpc DiscardDraftInvite(DiscardDraftInviteRequest) returns (DiscardDraftInviteResponse) {
    option (mcp.v1.tool) = {
      name: "member_invite_discard"
      title: "Discard a draft invite"
      description: "Drop a drafted invite. Only the person in the view can call this."
      required: ["org_id", "invite_id"]
      mutation: true
      destructive: true
      ui: "app"
      app_only: true
    };
  }
}

message Invite {
  // The invite's public id.
  string id = 1;
  string email = 2;
  // owner, admin or member.
  string role = 3;
  // pending, expired or draft.
  string status = 4;
  string invited_by_name = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

message CreateInviteRequest {
  // The organization's public id.
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string email = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.email) = true
  ];
  // owner, admin or member; you can only invite to a role whose permissions you hold.
  string role = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {in: ["owner", "admin", "member"]}
  ];
}

message CreateInviteResponse {
  Invite invite = 1;
  // The accept link, shown only in this response; share it if the email does not arrive.
  string link = 2;
}

message ResendInviteRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string invite_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
}

message ResendInviteResponse {
  Invite invite = 1;
  // The new accept link; the old one stops working.
  string link = 2;
}

message RevokeInviteRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string invite_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
}

message RevokeInviteResponse {}

message ListInvitesRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
}

message ListInvitesResponse {
  // Pending and expired invites, oldest first.
  repeated Invite invites = 1;
  // Drafts an assistant suggested that a person can still confirm.
  repeated Invite drafts = 2;
}

message DraftInviteRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string email = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.email) = true
  ];
}

message DraftInviteResponse {
  Invite invite = 1;
  // The organization's public id and name, for the confirmation view.
  string org_id = 2;
  string org_name = 3;
}

message ConfirmDraftInviteRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string invite_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
}

message ConfirmDraftInviteResponse {
  reserved 2;
  reserved "link";
  Invite invite = 1;
}

message DiscardDraftInviteRequest {
  string org_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string invite_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
}

message DiscardDraftInviteResponse {}
