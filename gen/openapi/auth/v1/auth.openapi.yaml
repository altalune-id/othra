openapi: 3.1.0
info:
  title: auth.v1
paths:
  /auth.v1.AuthService/ChangePassword:
    post:
      tags:
        - auth.v1.AuthService
      summary: ChangePassword
      description: ChangePassword checks the current password, sets a new one and signs out every other session.
      operationId: auth.v1.AuthService.ChangePassword
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.ChangePasswordRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.ChangePasswordResponse'
  /auth.v1.AuthService/SetActiveOrg:
    post:
      tags:
        - auth.v1.AuthService
      summary: SetActiveOrg
      description: SetActiveOrg makes an organization the signed-in person belongs to the active one of this session.
      operationId: auth.v1.AuthService.SetActiveOrg
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.SetActiveOrgRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.SetActiveOrgResponse'
  /auth.v1.AuthService/SignOutEverywhere:
    post:
      tags:
        - auth.v1.AuthService
      summary: SignOutEverywhere
      description: SignOutEverywhere ends every session of the signed-in person, this one included.
      operationId: auth.v1.AuthService.SignOutEverywhere
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.SignOutEverywhereRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.SignOutEverywhereResponse'
  /auth.v1.AuthService/UpdateProfile:
    post:
      tags:
        - auth.v1.AuthService
      summary: UpdateProfile
      description: UpdateProfile sets the signed-in person's name; an empty name falls back to the email in the console.
      operationId: auth.v1.AuthService.UpdateProfile
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.UpdateProfileRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.UpdateProfileResponse'
  /auth.v1.AuthService/Whoami:
    post:
      tags:
        - auth.v1.AuthService
      summary: Whoami
      description: Whoami describes the credential the request was made with.
      operationId: auth.v1.AuthService.Whoami
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth.v1.WhoamiRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth.v1.WhoamiResponse'
components:
  schemas:
    auth.v1.ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          title: current_password
        newPassword:
          type: string
          title: new_password
          maxLength: 256
          minLength: 12
      title: ChangePasswordRequest
      required:
        - currentPassword
        - newPassword
      additionalProperties: false
    auth.v1.ChangePasswordResponse:
      type: object
      title: ChangePasswordResponse
      additionalProperties: false
    auth.v1.SetActiveOrgRequest:
      type: object
      properties:
        orgId:
          type: string
          title: org_id
          description: |
            Public id of an organization the person belongs to; any other answers not found.
            othra.public_id = true
      title: SetActiveOrgRequest
      additionalProperties: false
    auth.v1.SetActiveOrgResponse:
      type: object
      properties:
        me:
          title: me
          description: The session after the switch, as Whoami describes it.
          $ref: '#/components/schemas/auth.v1.WhoamiResponse'
      title: SetActiveOrgResponse
      additionalProperties: false
    auth.v1.SignOutEverywhereRequest:
      type: object
      title: SignOutEverywhereRequest
      additionalProperties: false
    auth.v1.SignOutEverywhereResponse:
      type: object
      properties:
        signedOut:
          type: boolean
          title: signed_out
          description: 'Always true: this session ended too, so the client signs in again.'
      title: SignOutEverywhereResponse
      additionalProperties: false
    auth.v1.UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: |
            At most 200 characters; surrounding spaces are trimmed.
            user.name.max_len.200
      title: UpdateProfileRequest
      additionalProperties: false
    auth.v1.UpdateProfileResponse:
      type: object
      properties:
        userId:
          type: string
          title: user_id
          description: The person's public id.
        name:
          type: string
          title: name
      title: UpdateProfileResponse
      additionalProperties: false
    auth.v1.WhoamiRequest:
      type: object
      title: WhoamiRequest
      additionalProperties: false
    auth.v1.WhoamiResponse:
      type: object
      properties:
        source:
          type: string
          title: source
          description: local, basic, apikey or system.
        userId:
          type: string
          title: user_id
        email:
          type: string
          title: email
        name:
          type: string
          title: name
        avatarUrl:
          type: string
          title: avatar_url
        keyHint:
          type: string
          title: key_hint
          description: 'Set for API keys: the last 4 characters of the key''s secret.'
        ownerId:
          type: string
          title: owner_id
          description: 'Personal keys: the person the key acts for.'
        activeOrgId:
          type: string
          title: active_org_id
        activeOrgSlug:
          type: string
          title: active_org_slug
        activeProjectId:
          type: string
          title: active_project_id
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: Effective permissions after roles, key scopes and grants are intersected.
        operator:
          type: boolean
          title: operator
        orgCreation:
          type: boolean
          title: org_creation
          description: Whether this deployment lets the caller create organizations (cloud only).
        fileUploads:
          type: boolean
          title: file_uploads
          description: Whether this deployment has file storage, so the caller can upload files such as a project logo.
      title: WhoamiResponse
      additionalProperties: false
      description: Every id is a public id.
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
security: []
tags:
  - name: auth.v1.AuthService
