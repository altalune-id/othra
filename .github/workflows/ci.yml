name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  TOOL_STRICT: "1"

jobs:
  # Stage 1: static analysis, all in parallel.
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=3m ./...
      - name: Comment discipline
        run: make comment-check

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint (ui, docs, JSON, Markdown, CSS)
        run: pnpm lint

  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint, hadolint, actionlint, shellcheck (pinned Docker images)
        env:
          TOOL_DOCKER: "1"
        run: make lint-config

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: pnpm exec buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '\.proto$'; then
            pnpm exec buf breaking --against '.git#ref=refs/remotes/origin/main'
          else
            echo "origin/main has no .proto files yet; nothing to compare"
          fi

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated code matches its sources
        run: make generate-check
      - name: Config examples match the config structs
        run: make config-check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vulncheck

  lint-gate:
    runs-on: ubuntu-latest
    needs: [go-lint, js-lint, config-lint, proto, drift, vulncheck]
    steps:
      - run: echo "static analysis green"

  # Stage 2: tests. Go tests need the built sign-in page assets (make web), which are not committed.
  go-test:
    needs: lint-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make web
      - name: Unit tests (race, shuffle)
        run: go test -race -shuffle=on ./...

  go-cover:
    needs: lint-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make web
      - name: Unit + integration tests with the coverage gate (Postgres, Redis and NATS via testcontainers)
        run: make cover

  ui:
    needs: lint-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Tests
        run: make ui-test
      - name: Build the embedded UI (sign-in assets, MCP views, console)
        run: make ui
      - name: Storybook
        run: pnpm --filter @othra/console build-storybook --quiet

  # Stage 3: the image builds (no push).
  docker:
    needs: [go-test, go-cover, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT=${{ github.sha }}
