          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upstream.v1.SetUpstreamEnabledResponse'
  /upstream.v1.UpstreamService/UpdateUpstream:
    post:
      tags:
        - upstream.v1.UpstreamService
      summary: UpdateUpstream
      operationId: upstream.v1.UpstreamService.UpdateUpstream
      parameters:
        - name: Connect-Protocol-Version
          in: header
