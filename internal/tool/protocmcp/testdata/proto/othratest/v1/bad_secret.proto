syntax = "proto3";

package othratest.v1;

import "mcp/v1/annotations.proto";

option go_package = "github.com/altalune-id/othra/internal/tool/protocmcp/testdata/gen/othratest/v1;othratestv1";

// SecretService annotates an rpc whose response carries a secret.
service SecretService {
  rpc MintSecret(MintSecretRequest) returns (MintSecretResponse) {
    option (mcp.v1.tool) = {
      name: "secret_mint"
      description: "Mint a secret."
    };
  }
}

message MintSecretRequest {}

message MintSecretResponse {
  string secret = 1;
}
