syntax = "proto3";

package oagenttest.v1;

import "mcp/v1/annotations.proto";

option go_package = "altalune.id/oagent/internal/tool/protocmcp/testdata/gen/oagenttest/v1;oagenttestv1";

service BadRequiredService {
  rpc RequireGhost(BadRequiredRequest) returns (BadRequiredResponse) {
    option (mcp.v1.tool) = {
      name: "require_ghost"
      required: ["ghostField"]
    };
  }
}

message BadRequiredRequest {
  string project_id = 1;
}

message BadRequiredResponse {}
