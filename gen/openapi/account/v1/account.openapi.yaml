openapi: 3.1.0
info:
  title: account.v1
paths:
  /account.v1.AccountService/CreatePersonalToken:
    post:
      tags:
        - account.v1.AccountService
      summary: CreatePersonalToken
      description: 'SECURITY: needs a sign-in in the last 10 minutes (ACC009); the token is in this response only.'
      operationId: account.v1.AccountService.CreatePersonalToken
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account.v1.CreatePersonalTokenRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account.v1.CreatePersonalTokenResponse'
