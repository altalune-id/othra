version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/community/sudorandom-connect-openapi:v0.25.7
    out: gen/openapi
    opt:
      - format=yaml
  - remote: buf.build/bufbuild/es:v2.6.3
    out: ui/console/gen
    include_imports: true
    opt:
      - target=ts
      - import_extension=js
