        - projectId
        - resourceServerId
      additionalProperties: false
    resourceserver.v1.DeleteResourceServerResponse:
      type: object
      title: DeleteResourceServerResponse
      additionalProperties: false
    resourceserver.v1.GetResourceServerRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            othra.public_id = true
        resourceServerId:
          type: string
          title: resource_server_id
          description: |
            othra.public_id = true
      title: GetResourceServerRequest
      required:
        - projectId
        - resourceServerId
      additionalProperties: false
    resourceserver.v1.GetResourceServerResponse:
      type: object
      properties:
        resourceServer:
          title: resource_server
          $ref: '#/components/schemas/resourceserver.v1.ResourceServer'
      title: GetResourceServerResponse
      additionalProperties: false
    resourceserver.v1.Link:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
        clientName:
          type: string
          title: client_name
        resourceServerId:
          type: string
          title: resource_server_id
        resourceServerName:
          type: string
          title: resource_server_name
        resourceServerIdentifier:
          type: string
          title: resource_server_identifier
        resourceServerState:
          title: resource_server_state
          $ref: '#/components/schemas/resourceserver.v1.ResourceServerState'
        resourceServerTrusted:
          type: boolean
          title: resource_server_trusted
        scopes:
          type: array
          items:
            type: string
          title: scopes
          description: scopes are the resource server scopes the client may ask for.
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Link
      additionalProperties: false
    resourceserver.v1.LinkClientRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            othra.public_id = true
        clientId:
          type: string
          title: client_id
          description: |
            othra.public_id = true
        resourceServerId:
          type: string
          title: resource_server_id
          description: |
            othra.public_id = true
        scopes:
          type: array
          items:
            type: string
            maxLength: 128
          title: scopes
          maxItems: 64
          minItems: 1
      title: LinkClientRequest
      required:
        - projectId
        - clientId
        - resourceServerId
      additionalProperties: false
    resourceserver.v1.LinkClientResponse:
      type: object
      properties:
        link:
          title: link
          $ref: '#/components/schemas/resourceserver.v1.Link'
      title: LinkClientResponse
      additionalProperties: false
    resourceserver.v1.ListLinksRequest:
      type: object
      allOf:
        - properties:
            projectId:
              type: string
              title: project_id
              description: |
                othra.public_id = true
        - oneOf:
            - type: object
              properties:
                clientId:
                  type: string
                  title: client_id
                  description: |
                    othra.public_id = true
              title: client_id
              required:
                - clientId
            - type: object
              properties:
                resourceServerId:
                  type: string
                  title: resource_server_id
                  description: |
                    othra.public_id = true
              title: resource_server_id
              required:
                - resourceServerId
      title: ListLinksRequest
      required:
        - projectId
      additionalProperties: false
    resourceserver.v1.ListLinksResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/resourceserver.v1.Link'
          title: links
      title: ListLinksResponse
      additionalProperties: false
    resourceserver.v1.ListResourceServersRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            othra.public_id = true
      title: ListResourceServersRequest
      required:
        - projectId
      additionalProperties: false
    resourceserver.v1.ListResourceServersResponse:
      type: object
      properties:
        resourceServers:
          type: array
          items:
            $ref: '#/components/schemas/resourceserver.v1.ResourceServer'
          title: resource_servers
        trustAvailable:
          type: boolean
          title: trust_available
          description: trust_available is true when this deployment allows trust without verification.
      title: ListResourceServersResponse
      additionalProperties: false
    resourceserver.v1.ResourceServer:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        identifier:
          type: string
          title: identifier
          description: identifier is the audience, exactly as the resource server checks it.
        scopes:
          type: array
          items:
            type: string
          title: scopes
        state:
          title: state
          $ref: '#/components/schemas/resourceserver.v1.ResourceServerState'
        trusted:
          type: boolean
          title: trusted
          description: trusted skips verification, on self-hosted Othra only.
        verifiedAt:
          title: verified_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastCheckedAt:
          title: last_checked_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastError:
          title: last_error
          description: last_error is why the latest check failed, unset after a pass.
          $ref: '#/components/schemas/resourceserver.v1.VerificationFailure'
        consecutiveFailures:
          type: integer
          title: consecutive_failures
          format: int32
        metadataUrl:
          type: string
          title: metadata_url
          description: metadata_url is where Othra fetches the RFC 9728 metadata.
        trustAvailable:
          type: boolean
          title: trust_available
          description: trust_available is true when this deployment allows trust without verification.
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updatedAt:
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ResourceServer
      additionalProperties: false
    resourceserver.v1.ResourceServerState:
      type: string
      title: ResourceServerState
      enum:
        - RESOURCE_SERVER_STATE_UNSPECIFIED
        - RESOURCE_SERVER_STATE_PENDING
        - RESOURCE_SERVER_STATE_VERIFIED
        - RESOURCE_SERVER_STATE_FAILED
      description: ResourceServerState is where RFC 9728 verification stands.
    resourceserver.v1.SetResourceServerTrustRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: |
            othra.public_id = true
        resourceServerId:
          type: string
          title: resource_server_id
          description: |
            othra.public_id = true
        trusted:
          type: boolean
          title: trusted
      title: SetResourceServerTrustRequest
      required:
        - projectId
        - resourceServerId
      additionalProperties: false
    resourceserver.v1.SetResourceServerTrustResponse:
      type: object
      properties:
