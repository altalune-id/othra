            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upstream.v1.GetUpstreamRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upstream.v1.GetUpstreamResponse'
  /upstream.v1.UpstreamService/ListUpstreams:
    post:
      tags:
        - upstream.v1.UpstreamService
      summary: ListUpstreams
      operationId: upstream.v1.UpstreamService.ListUpstreams
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upstream.v1.ListUpstreamsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upstream.v1.ListUpstreamsResponse'
  /upstream.v1.UpstreamService/SetUpstreamEnabled:
    post:
      tags:
