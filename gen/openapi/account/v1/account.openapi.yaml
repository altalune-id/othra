components:
  schemas:
    account.v1.AppResource:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the resource server's public id; empty for sign-in only (OIDC).
        name:
          type: string
          title: name
        identifier:
          type: string
          title: identifier
        scopes:
          type: array
          items:
            type: string
          title: scopes
        scopeDescriptions:
          type: object
          title: scope_descriptions
          additionalProperties:
            type: string
            title: value
      title: AppResource
      additionalProperties: false
    account.v1.AppResource.ScopeDescriptionsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ScopeDescriptionsEntry
      additionalProperties: false
    account.v1.ConnectedApp:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
          description: 'client_id is the app''s client_id: a public id, or the https URL of an app without registration (CIMD).'
        name:
          type: string
          title: name
        metadataHost:
          type: string
          title: metadata_host
          description: metadata_host is the host of an app without registration; empty for a registered app.
        resources:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.AppResource'
          title: resources
        consented:
          type: boolean
          title: consented
          description: consented is false for a first-party app that never showed a consent page.
        offline:
          type: boolean
          title: offline
          description: offline is true while the app holds access that outlives a sign-out (offline_access).
        connectedAt:
          title: connected_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastUsedAt:
          title: last_used_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ConnectedApp
      additionalProperties: false
    account.v1.CreatePersonalTokenRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 100
          description: |
            othra.name.blank = true
            othra.name.max_len.200 = true
        serverId:
          type: string
          title: server_id
          description: |
            othra.public_id = true
        scopes:
          type: array
          items:
            type: string
            maxLength: 128
            minLength: 1
          title: scopes
          maxItems: 64
          minItems: 1
          uniqueItems: true
        expiry:
          not:
            enum:
              - TOKEN_EXPIRY_UNSPECIFIED
          title: expiry
          $ref: '#/components/schemas/account.v1.TokenExpiry'
      title: CreatePersonalTokenRequest
      required:
        - name
        - serverId
      additionalProperties: false
    account.v1.CreatePersonalTokenResponse:
      type: object
      properties:
        token:
          title: token
          $ref: '#/components/schemas/account.v1.PersonalToken'
        secret:
          type: string
          title: secret
          description: secret is the one-time token. It is never present on any other response.
      title: CreatePersonalTokenResponse
      additionalProperties: false
    account.v1.DisconnectAppRequest:
      type: object
      properties:
        clientId:
          type: string
          title: client_id
          maxLength: 2048
      title: DisconnectAppRequest
      required:
        - clientId
      additionalProperties: false
    account.v1.DisconnectAppResponse:
      type: object
      title: DisconnectAppResponse
      additionalProperties: false
    account.v1.EndOtherSessionsRequest:
      type: object
      title: EndOtherSessionsRequest
      additionalProperties: false
    account.v1.EndOtherSessionsResponse:
      type: object
      properties:
        ended:
          type: integer
          title: ended
          format: int32
      title: EndOtherSessionsResponse
      additionalProperties: false
    account.v1.EndSessionRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: |
            othra.public_id = true
      title: EndSessionRequest
      required:
        - sessionId
      additionalProperties: false
    account.v1.EndSessionResponse:
      type: object
      title: EndSessionResponse
      additionalProperties: false
    account.v1.GetProfileRequest:
      type: object
      title: GetProfileRequest
      additionalProperties: false
    account.v1.GetProfileResponse:
      type: object
      properties:
        profile:
          title: profile
          $ref: '#/components/schemas/account.v1.Profile'
        signOutToken:
          type: string
          title: sign_out_token
          description: sign_out_token is the CSRF token of the hosted sign-out form (POST /p/<handle>/login/signout).
        currentSessionId:
          type: string
          title: current_session_id
          description: current_session_id is the public id of this browser's active user session, the one the sign-out form ends.
      title: GetProfileResponse
      additionalProperties: false
    account.v1.GetSignInMethodsRequest:
      type: object
      title: GetSignInMethodsRequest
      additionalProperties: false
    account.v1.GetSignInMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.SignInMethod'
          title: methods
        linkToken:
          type: string
          title: link_token
          description: link_token is the CSRF token of the hosted connect form (POST /p/<handle>/federation/google/start, intent=link).
      title: GetSignInMethodsResponse
      additionalProperties: false
    account.v1.ListConnectedAppsRequest:
      type: object
      title: ListConnectedAppsRequest
      additionalProperties: false
    account.v1.ListConnectedAppsResponse:
      type: object
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.ConnectedApp'
          title: apps
      title: ListConnectedAppsResponse
      additionalProperties: false
    account.v1.ListPersonalTokensRequest:
      type: object
      title: ListPersonalTokensRequest
      additionalProperties: false
    account.v1.ListPersonalTokensResponse:
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.PersonalToken'
          title: tokens
      title: ListPersonalTokensResponse
      additionalProperties: false
    account.v1.ListSessionsRequest:
      type: object
      title: ListSessionsRequest
      additionalProperties: false
    account.v1.ListSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.Session'
          title: sessions
      title: ListSessionsResponse
      additionalProperties: false
    account.v1.ListTokenServersRequest:
      type: object
      title: ListTokenServersRequest
      additionalProperties: false
    account.v1.ListTokenServersResponse:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/account.v1.TokenServer'
          title: servers
      title: ListTokenServersResponse
      additionalProperties: false
    account.v1.PersonalToken:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        hint:
          type: string
          title: hint
          description: hint is the token's last 4 characters.
        server:
          title: server
          $ref: '#/components/schemas/account.v1.TokenServer'
        scopes:
          type: array
          items:
            type: string
          title: scopes
        state:
          title: state
          $ref: '#/components/schemas/account.v1.PersonalTokenState'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastUsedAt:
          title: last_used_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        revokedAt:
          title: revoked_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: PersonalToken
      additionalProperties: false
    account.v1.PersonalTokenState:
      type: string
      title: PersonalTokenState
      enum:
        - PERSONAL_TOKEN_STATE_UNSPECIFIED
        - PERSONAL_TOKEN_STATE_ACTIVE
        - PERSONAL_TOKEN_STATE_EXPIRED
        - PERSONAL_TOKEN_STATE_REVOKED
      description: PersonalTokenState is where a personal token stands.
    account.v1.Profile:
      type: object
      properties:
        id:
          type: string
          title: id
        email:
          type: string
          title: email
        name:
          type: string
          title: name
          description: name is what apps see as the name claim; empty shows none.
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Profile
      additionalProperties: false
    account.v1.RevokePersonalTokenRequest:
      type: object
      properties:
        tokenId:
          type: string
          title: token_id
          description: |
            othra.public_id = true
      title: RevokePersonalTokenRequest
      required:
        - tokenId
      additionalProperties: false
    account.v1.RevokePersonalTokenResponse:
      type: object
      title: RevokePersonalTokenResponse
      additionalProperties: false
    account.v1.Session:
      type: object
      properties:
        id:
          type: string
          title: id
        method:
          title: method
          $ref: '#/components/schemas/account.v1.SignInMethodKind'
        userAgent:
          type: string
          title: user_agent
          description: user_agent is the browser's own description, raw; the portal shortens it.
        authTime:
          title: auth_time
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastSeenAt:
          title: last_seen_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        current:
          type: boolean
          title: current
          description: current is the session this request came from.
      title: Session
      additionalProperties: false
    account.v1.SignInMethod:
      type: object
      properties:
        kind:
          title: kind
          $ref: '#/components/schemas/account.v1.SignInMethodKind'
        linked:
          type: boolean
          title: linked
          description: linked is false for an upstream IdP the project offers that this end user hasn't connected.
        identityId:
          type: string
          title: identity_id
          description: identity_id names a linked upstream identity, for UnlinkIdentity.
        email:
          type: string
          title: email
          description: email is the address this method signs in with.
        linkedAt:
          title: linked_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        lastUsedAt:
          title: last_used_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        canRemove:
          type: boolean
          title: can_remove
        lock:
          title: lock
          $ref: '#/components/schemas/account.v1.SignInMethodLock'
      title: SignInMethod
      additionalProperties: false
    account.v1.SignInMethodKind:
      type: string
      title: SignInMethodKind
      enum:
        - SIGN_IN_METHOD_KIND_UNSPECIFIED
        - SIGN_IN_METHOD_KIND_EMAIL_LINK
        - SIGN_IN_METHOD_KIND_GOOGLE
      description: SignInMethodKind is a way to sign in.
    account.v1.SignInMethodLock:
      type: string
      title: SignInMethodLock
      enum:
        - SIGN_IN_METHOD_LOCK_UNSPECIFIED
        - SIGN_IN_METHOD_LOCK_LAST_METHOD
      description: SignInMethodLock is why a method can't be removed now.
    account.v1.TokenExpiry:
      type: string
      title: TokenExpiry
      enum:
        - TOKEN_EXPIRY_UNSPECIFIED
        - TOKEN_EXPIRY_7_DAYS
        - TOKEN_EXPIRY_30_DAYS
        - TOKEN_EXPIRY_90_DAYS
      description: TokenExpiry is how long a new personal token lives; never more than 90 days.
    account.v1.TokenServer:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        identifier:
          type: string
          title: identifier
        scopes:
          type: array
          items:
            type: string
          title: scopes
        scopeDescriptions:
          type: object
          title: scope_descriptions
          additionalProperties:
            type: string
            title: value
      title: TokenServer
      additionalProperties: false
    account.v1.TokenServer.ScopeDescriptionsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: ScopeDescriptionsEntry
      additionalProperties: false
    account.v1.UnlinkIdentityRequest:
      type: object
      properties:
        identityId:
          type: string
          title: identity_id
          description: |
            othra.public_id = true
      title: UnlinkIdentityRequest
      required:
        - identityId
      additionalProperties: false
    account.v1.UnlinkIdentityResponse:
      type: object
      title: UnlinkIdentityResponse
      additionalProperties: false
    account.v1.UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          title: name
