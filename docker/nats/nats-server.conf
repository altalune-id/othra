# Local dev copy of the shared Altalune NATS (github.com/altalune-id/nats): one account per app, same limits.
# OTHER stands in for another app on the same server; a job published by Othra never reaches it.
# Each password is read from the environment; require-passwords.sh refuses to start without it.
server_name: othra-dev-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_file_store: 6G
  max_memory_store: 96M
}

accounts {
  OTHRA {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: othra, password: $OTHRA_NATS_PASSWORD }]
  }
  OTHER {
    jetstream { max_file: 1G, max_mem: 16M }
    users: [{ user: other, password: $OTHER_NATS_PASSWORD }]
  }
}
