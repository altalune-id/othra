# development prints emails to the log (console mail driver) and allows http:// webhook URLs.
# For production, set production and configure mail, see the commented lines below.
env: development
# roles from scripts/db/provision.sh (the compose Postgres runs it on first start; dev-only passwords)
postgres:
  dsn: postgres://othra_service:othra-dev-service-password@localhost:5432/othra?sslmode=disable
  migrator:
    dsn: postgres://othra_migrator:othra-dev-migrator-password@localhost:5432/othra?sslmode=disable
    role: othra_owner
http:
  # generate: openssl rand -hex 32
  stateSecret: "f8e6ed3aae2d359d0ecd41f884ffc71631bb16e10cc69205da1e7767aeab9074"
secrets:
  # required in every mode: it seals each project's signing keys; generate: openssl rand -hex 32
  encryptionKey: "6d8f96d24a1ae4aabc10010dcdc7d23f98c1bdd5c8ca81209313f968abad27de"
mail:
  # console prints emails to the log; refused in production
  driver: console
# production mail (required when env: production; replaces the mail block above):
# http:
#   baseURL: https://othra.example.com   # one public URL per deployment; the console's sign-in follows it
# mail:
#   driver: smtp            # or resend, with resend.apiKey
#   from: Othra <noreply@example.com>
#   smtp:
#     host: ""
