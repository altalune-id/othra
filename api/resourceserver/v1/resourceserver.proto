message CreateResourceServerRequest {
  string project_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.(othra.v1.public_id) = true
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {id: "resource_server.name.blank", expression: "this.trim() != '' ? '' : 'must not be blank'"},
    (buf.validate.field).cel = {id: "resource_server.name.max_len.100", expression: "this.trim().size() <= 100 ? '' : 'must be at most 100 characters'"}
  ];
  string identifier = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 512
  ];
  repeated string scopes = 4 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 128
  ];
  bool trusted = 5;
  map<string, string> scope_descriptions = 6 [
    (buf.validate.field).map.max_pairs = 64,
    (buf.validate.field).map.keys.string.max_len = 128,
    (buf.validate.field).map.values.string.min_len = 1,
    (buf.validate.field).map.values.string.max_len = 120
  ];
}

message CreateResourceServerResponse {
  ResourceServer resource_server = 1;
}

